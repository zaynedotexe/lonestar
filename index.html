<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lonestar</title>
<link rel="stylesheet" href="style.css?v=3" />
</head>
<body>

<!-- Painted visible by default: the DUI is remote, so the first Lua message
     can arrive before this page exists. Never start hidden. -->
<div id="menu" class="menu">

  <div class="banner">
    <span class="banner-text" id="bannerText">LONESTAR</span>
    <span class="banner-tag" id="bannerTag">v1.0</span>
  </div>

  <div class="frame">

    <aside class="rail">
      <div class="brand">
        <span class="brand-name" id="brand">LONESTAR</span>
        <span class="brand-version" id="version">v1.0</span>
      </div>
      <nav class="tabs" id="tabs"></nav>
      <div class="rail-foot">
        <div class="kb-row"><b id="menuKey">INSERT</b><span>toggle</span></div>
        <div class="kb-row"><b>ENTER</b><span>select</span></div>
        <div class="kb-row"><b>BACK</b><span>back</span></div>
        <div class="kb-row"><b>PAGE</b><span>tab</span></div>
      </div>
    </aside>

    <section class="body">
      <header class="head">
        <div class="crumb">
          <h1 id="crumb">Lonestar</h1>
          <span class="sub" id="hint">select a group</span>
        </div>
        <div class="status" id="status">detecting...</div>
      </header>
      <ul class="list" id="list"></ul>
    </section>

  </div>

</div>

<div id="dropdown" class="dropdown hidden">
  <ul id="dropdownList"></ul>
</div>

<div id="keyboard" class="keyboard hidden">
  <div class="kb-box">
    <div class="kb-title" id="kbTitle">Input</div>
    <div class="kb-value" id="kbValue"></div>
    <div class="kb-foot"><span><b>ENTER</b> confirm</span><span><b>ESC</b> cancel</span></div>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<script src="app.js?v=3"></script>
</body>
</html>
