<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lonestar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css?v=4" />
</head>
<body>

<!-- Same structure as the Allstar DUI: a compact panel anchored to the left,
     vertically centred, with the rest of the page left transparent. -->
<div id="menu" class="VWrapper">

  <div class="VLeftElements">

    <div class="VBanner">
      <div class="VBannerGlow"></div>
      <div class="VBannerText">
        <span id="bannerName">LONESTAR</span>
        <em id="bannerVer">v1.0</em>
      </div>
    </div>

    <div class="PCategories" id="categories">
      <div class="highlight" id="highlight"></div>
    </div>

    <div class="VLeftInnerElements">
      <div class="VScroll" id="vscroll"></div>
      <div class="VTabs" id="list"></div>
    </div>

    <div class="VFooter">
      <div class="FooterInfo">
        <span class="FooterLogo" id="footerBrand">LS</span>
        <span class="Name" id="footerName">Lonestar</span>
      </div>
      <span class="Indicator" id="footerStatus">detecting</span>
    </div>

  </div>
</div>

<!-- bottom-centre hint, as in Allstar -->
<div id="desc" class="VDesc hidden"><span id="descText"></span></div>

<!-- bottom-centre input prompt -->
<div id="keyboard" class="InputWrapper hidden">
  <div class="VBind">
    <div class="PromptText">
      <span class="PromptTitle" id="kbTitle">Input</span>
      <span class="PromptValue" id="kbValue"></span>
    </div>
  </div>
</div>

<!-- top-left keybind list -->
<div id="keybinds" class="KBLWrapper hidden">
  <div class="Keybinds" id="kbList"></div>
</div>

<div id="dropdown" class="Dropdown hidden"><ul id="dropdownList"></ul></div>

<div class="NotificationsWrapper" id="toasts"></div>

<script src="app.js?v=4"></script>
</body>
</html>
